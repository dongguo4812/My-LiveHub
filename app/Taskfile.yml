version: '3'

vars:
  VITE_PORT: '{{.WAILS_VITE_PORT | default "8769"}}'

tasks:
  dev:
    summary: 生成 Wails 前端绑定并启动 My-LiveHub 桌面开发环境
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev-preflight.ps1 -Port {{.VITE_PORT}}
      - wails3 generate bindings -ts
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
  lx-runtime:install:
    summary: 安装洛雪原版 Electron 音源运行环境
    cmds:
      - npm --prefix lx-runtime install --no-audit --no-fund
      - npm --prefix lx-runtime run build
  build:
    summary: 构建 My-LiveHub 并附带洛雪 Electron 音源运行环境
    cmds:
      - npm --prefix lx-runtime install --no-audit --no-fund
      - npm --prefix lx-runtime run package
      - wails3 build
      - powershell.exe -NoProfile -Command "New-Item -ItemType Directory -Force -Path ./bin/lx-runtime | Out-Null; Copy-Item -Path ./lx-runtime/release/win-unpacked/* -Destination ./bin/lx-runtime -Recurse -Force"
  frontend:install:
    summary: 安装管理端前端依赖
    cmds:
      - npm --prefix frontend install
  frontend:build:
    summary: 构建管理端前端
    cmds:
      - npm --prefix frontend run build
  test:
    summary: 运行 Go 测试
    cmds:
      - go test ./...

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海克斯展示</title>
<link rel="stylesheet" href="/static/style.css?v=20261105-unmatched-screenshot">
</head>
<body class="display-body">
<main class="display-main">
<div id="cards" class="display-cards"></div>
</main>

<script>
function esc(s){
    return String(s||'').replace(/[&<>"']/g,c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    }[c]))
}

function qualityClass(level){
    return ({
        kSilver:'quality-silver',
        kGold:'quality-gold',
        kPrismatic:'quality-prismatic'
    })[level]||''
}

let lastRenderedAt=null;

async function load(){
    try{
        const d=await(await fetch('/api/state',{cache:'no-store'})).json();
        if(lastRenderedAt!==null && d.updated_at===lastRenderedAt) return;
        lastRenderedAt=d.updated_at;
        const root=document.getElementById('cards');
        root.innerHTML='';

        // 综合展示固定展示前六张卡片，保持三列布局。
        (d.cards||[]).slice(0,6).forEach(c=>{
            const el=document.createElement('div');
            el.className=('display-card '+qualityClass(c.level)).trim();

            const screenshot = `/asset/screenshot/${encodeURIComponent(c.filename)}`;

            // 没有匹配到海克斯名称时，只展示原始截图，不再显示文字区域。
            if(!c.name){
                el.classList.add('is-unmatched');
                el.innerHTML = `
                    <img class="unmatched-screenshot"
                         src="${screenshot}"
                         alt="未匹配到海克斯名称的原始截图">
                `;
                root.appendChild(el);
                return;
            }

            const img=c.augment_id
                ? `/asset/hex/${encodeURIComponent(c.augment_id)}.png`
                : screenshot;

            // 根据 OCR 原始文本判断是否为质变海克斯
            const isMutated=/^已质变\\s*[:：]/.test((c.ocr_text||'').trim());

            // 标题使用数据库名称，质变时添加前缀
            const displayName=(isMutated?'已质变：':'')+c.name;

            el.innerHTML=`
                <img
                    src="${img}"
                    onerror="this.onerror=null;this.src='${screenshot}'"
                    alt=""
                >
                <div class="display-name">${esc(displayName)}</div>
            `;

            root.appendChild(el);
        });
    }catch(e){}
}

load();
setInterval(load,1500);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,0)!important;background-color:transparent!important;color-scheme:normal}
    body{position:relative}
    canvas{display:block;position:absolute;inset:0;width:100%;height:100%;background:rgba(0,0,0,0)!important;background-color:transparent!important}
  </style>
</head>
<body>
  <canvas id="live2d-layer-canvas"></canvas>
  <script>
    (function(){
      const params=new URLSearchParams(location.search);
      const modelURL=params.get('model');
      const canvas=document.getElementById('live2d-layer-canvas');
      if(!modelURL){console.error('Live2D model URL is missing');return;}
      const script=document.createElement('script');
      script.src='/live2d-runtime/moc2/live2d.min.js';
      script.onload=function(){
        const dpr=Math.max(1,window.devicePixelRatio||1);
        canvas.width=Math.max(1,Math.round(canvas.clientWidth*dpr));
        canvas.height=Math.max(1,Math.round(canvas.clientHeight*dpr));
        if(typeof window.loadlive2d!=='function'){console.error('MOC2 runtime API is unavailable');return;}
        window.loadlive2d(canvas.id,modelURL);
        const scale=Number(params.get('scale')||0.65);
        const offsetX=Number(params.get('x')||0);
        const offsetY=Number(params.get('y')||0);
        let base=null;
        const apply=()=>{
          const model=window.__live2dManager&&window.__live2dManager.getModel&&window.__live2dManager.getModel(0);
          const matrix=model&&model.modelMatrix;
          if(!model||!model.initialized||!matrix||!matrix.width||!matrix.height)return false;
          if(!base||base.model!==model){
            const sx=matrix.getScaleX(),sy=matrix.getScaleY();
            base={model,sx,sy,cx:matrix.tr[12]+matrix.width*sx/2,cy:matrix.tr[13]+matrix.height*sy/2};
          }
          const width=matrix.width*Math.abs(base.sx),height=matrix.height*Math.abs(base.sy);
          const fit=Math.min(1,2/width,2/height);
          matrix.scale(base.sx*fit*scale,base.sy*fit*scale);
          matrix.centerX(base.cx+offsetX*2/100);
          matrix.centerY(base.cy-offsetY*2/100);
          return true;
        };
        let attempts=0;
        const timer=setInterval(()=>{attempts++;if(apply()||attempts>=300)clearInterval(timer);},100);
      };
      script.onerror=function(){console.error('Failed to load MOC2 runtime');};
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>

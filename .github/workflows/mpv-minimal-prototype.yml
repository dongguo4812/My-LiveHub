name: mpv minimal prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-minimal-mpv:
    name: Build trimmed mpv v0.42.0 (Windows x64)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.10
      options: --security-opt seccomp=unconfined
    timeout-minutes: 120
    env:
      TARGET: x86_64-w64-mingw32
      RUST_TARGET: x86_64-pc-windows-gnu
      WINEPREFIX: /tmp/wine
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      DOWNLOAD_CACHE: ${{ github.workspace }}/.ccache/downloads
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates ccache cmake g++-mingw-w64 gcc-multilib git make meson nasm ninja-build pkgconf rustup wget xz-utils wine64
          rustup default stable
          rustup target add ${RUST_TARGET}

      - name: Checkout My-LiveHub
        uses: actions/checkout@v4

      - name: Checkout pinned mpv source
        run: |
          git clone --depth=1 --branch v0.42.0 https://github.com/mpv-player/mpv.git mpv-src
          cp app/scripts/build-mpv-minimal.sh mpv-src/build-mpv-minimal.sh

      - name: Build upstream MinGW dependencies
        working-directory: mpv-src
        run: ./ci/build-mingw64.sh

      - name: Build trimmed mpv and stage runtime
        working-directory: mpv-src
        run: |
          chmod +x build-mpv-minimal.sh
          ./build-mpv-minimal.sh
          mkdir -p ../artifacts/mpv-minimal
          cp -a artifact-minimal/. ../artifacts/mpv-minimal/

      - name: Run Windows executable smoke test under Wine
        working-directory: artifacts/mpv-minimal
        run: ./mpv.com --version

      - name: Upload internal validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-minimal-windows-x64-prototype
          path: artifacts/mpv-minimal/
          if-no-files-found: error
          retention-days: 14

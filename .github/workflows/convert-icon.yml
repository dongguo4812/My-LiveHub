name: Convert application icon

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/convert-icon.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert PNG to multi-size ICO
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open("app/build/icon.png").convert("RGBA")
          image.save("app/build/icon.ico", format="ICO",
                     sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          check = Image.open("app/build/icon.ico")
          assert check.format == "ICO"
          print("ICO frames:", check.info.get("sizes"))
          PY
      - name: Commit ICO
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build/icon.ico
          git commit -m "chore: convert application icon to ICO"
          git push origin HEAD:dev

name: QuickJS-NG PoC

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickjs-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickjs-windows-x64:
    name: QuickJS-NG Windows x64 CGo and LX runtime
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Avoid a full MSYS2 system upgrade on every CI run; it adds extra
          # mirror metadata requests and has caused transient signature-download timeouts.
          update: false
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Fetch pinned QuickJS-NG source
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs-ng"
          git -C "$RUNNER_TEMP/quickjs-ng" rev-parse HEAD

      - name: Instrument pinned QuickJS arithmetic opcodes for LX signature tracing
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          python "$WORKSPACE/.github/scripts/instrument-quickjs-ops.py" "$RUNNER_TEMP/quickjs-ng/quickjs.c"

      - name: Build QuickJS-NG and native C API smoke test
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          cmake -S "$WORKSPACE/app/internal/music/lxruntime/poc/native" -B "$TEMP_DIR/lx-quickjs-host-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUICKJS_NG_SOURCE_DIR="$TEMP_DIR/quickjs-ng"
          cmake --build "$TEMP_DIR/lx-quickjs-host-build" --config Release
          host="$(find "$TEMP_DIR/lx-quickjs-host-build" -type f -iname 'lx_quickjs_host_smoke.exe' -print -quit)"
          test -n "$host"
          test -f "$TEMP_DIR/lx-quickjs-host-build/lib/libqjs.a"
          "$host"
          ls -lh "$host" "$TEMP_DIR/lx-quickjs-host-build/lib/libqjs.a"

      - name: Test Go CGo runtime and pinned LX scripts
        shell: msys2 {0}
        env:
          LX_RCONFIG_LIVE: "1"
          LX_QJS_TRACE_OPS: "1"
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          cd "$WORKSPACE/app"
          export CGO_ENABLED=1
          export CC=gcc
          export CGO_LDFLAGS="-L$TEMP_DIR/lx-quickjs-host-build/lib -lqjs"
          go test -tags lxquickjs -count=3 -run '^TestLXSourceRConfigLiveHandshake$' ./internal/music/lxruntime
          go test -tags lxquickjs -count=1 -v ./internal/music/lxruntime
          # Exercise the production build tag through the full desktop dependency graph.
          go test -tags lxproduction ./...
          go build -tags lxproduction -ldflags "-H=windowsgui" -o "$TEMP_DIR/My-LiveHub-production.exe" .
          ls -lh "$TEMP_DIR/My-LiveHub-production.exe"

      - name: Measure QuickJS runtime lifecycle and binary footprint
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          cd "$WORKSPACE/app"
          export CGO_ENABLED=1
          export CC=gcc
          export CGO_LDFLAGS="-L$TEMP_DIR/lx-quickjs-host-build/lib -lqjs"
          go test -tags lxquickjs -run '^TestLXRuntimeDefaultResourceLimits$' ./internal/music/lxruntime
          go test -tags lxquickjs -run '^$' -bench '^BenchmarkLXRuntime(CreateClose|Eval)$' -benchtime=100x -benchmem ./internal/music/lxruntime
          go test -tags lxquickjs -c -o "$TEMP_DIR/lxruntime.test.exe" ./internal/music/lxruntime
          ls -lh "$TEMP_DIR/lx-quickjs-host-build/lib/libqjs.a" "$TEMP_DIR/lx-quickjs-host-build/lx_quickjs_host_smoke.exe" "$TEMP_DIR/lxruntime.test.exe"

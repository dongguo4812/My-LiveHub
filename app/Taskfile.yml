version: '3'

vars:
  VITE_PORT: '{{.WAILS_VITE_PORT | default "8769"}}'

tasks:
  dev:
    summary: 自动准备兼容的 QuickJS-NG 运行时并启动 My-LiveHub 桌面开发环境（无需本机 C 编译器）
    env:
      GOFLAGS: -tags=lxproduction
      CGO_ENABLED: "0"
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/lxproduction.ps1 -Mode dev -Port {{.VITE_PORT}}
  build:
    summary: 自动准备兼容的 QuickJS-NG 运行时并构建 My-LiveHub 桌面应用（无需本机 C 编译器）
    env:
      GOFLAGS: -tags=lxproduction
      CGO_ENABLED: "0"
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/lxproduction.ps1 -Mode build
  frontend:install:
    summary: 安装管理端前端依赖
    cmds:
      - npm --prefix frontend install
  frontend:build:
    summary: 构建管理端前端
    cmds:
      - npm --prefix frontend run build
  test:
    summary: 运行 Go 测试
    cmds:
      - go test ./...

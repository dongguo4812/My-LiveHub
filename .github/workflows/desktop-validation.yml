name: Desktop validation

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-client:
    name: Formal client frontend and Go validation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3.exe
          key: wails3-${{ runner.os }}-go1.27-v3.0.0

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails3.exe'
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          }

      - name: Generate frontend bindings
        shell: pwsh
        run: wails3 generate bindings -ts

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Test Go
        run: go test ./...

      - name: Build Windows executable
        shell: pwsh
        run: go build -o bin/My-LiveHub.exe .

  mpv-runtime:
    name: Validate pinned Windows x64 mpv runtime
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache upstream mpv archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mpv-v0.42.0-x86_64-w64-mingw32-full.zip
          key: mpv-v0.42.0-x86_64-w64-mingw32-full-c7d4ff6a67dd3365

      - name: Download and verify mpv archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpv-v0.42.0-x86_64-w64-mingw32-full.zip"
          $url = "https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-x86_64-w64-mingw32-full.zip"
          $expected = "c7d4ff6a67dd33659f71d81efa56335fea2213c7522fd67235f3abf0d9ea1dbd"

          if (!(Test-Path $archive)) {
            Invoke-WebRequest -Uri $url -OutFile $archive
          }

          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Remove-Item -Force $archive
            throw "mpv archive SHA-256 mismatch. Expected $expected, got $actual"
          }

          $extract = Join-Path $env:RUNNER_TEMP "mpv-runtime"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          New-Item -ItemType Directory -Path $extract | Out-Null
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $mpv = Get-ChildItem -Path $extract -Filter "mpv.exe" -File -Recurse | Select-Object -First 1
          if (!$mpv) { throw "Pinned mpv archive does not contain mpv.exe" }
          $license = Get-ChildItem -Path $extract -Filter "LICENSE.GPL" -File -Recurse | Select-Object -First 1
          if (!$license) { throw "Pinned mpv archive does not contain LICENSE.GPL" }

          "MPV_EXECUTABLE=$($mpv.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified archive SHA-256: $actual"
          Write-Host "mpv executable: $($mpv.FullName)"
          Write-Host "GPL license: $($license.FullName)"

      - name: Verify mpv starts
        shell: pwsh
        run: |
          $output = & $env:MPV_EXECUTABLE --no-config --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "mpv failed to start (exit code $LASTEXITCODE): $($output -join [Environment]::NewLine)"
          }
          $version = $output | Select-String -Pattern "^mpv v?0\.42\.0"
          if (!$version) {
            throw "Unexpected mpv version output: $($output -join [Environment]::NewLine)"
          }
          $output | Select-Object -First 5 | ForEach-Object { Write-Host $_ }

name: Desktop validation

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prototype/desktop-validation/My-LiveHub-Desktop-Validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: prototype/desktop-validation/My-LiveHub-Desktop-Validation/go.sum

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: prototype/desktop-validation/My-LiveHub-Desktop-Validation/frontend/package-lock.json

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3.exe
          key: wails3-${{ runner.os }}-go1.27-v3.0.0

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails3.exe'
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          }

      - name: Generate frontend bindings
        shell: pwsh
        run: wails3 generate bindings -ts

      - name: Install frontend dependencies
        working-directory: prototype/desktop-validation/My-LiveHub-Desktop-Validation/frontend
        run: npm ci

      - name: Build frontend
        working-directory: prototype/desktop-validation/My-LiveHub-Desktop-Validation/frontend
        run: npm run build

      - name: Test Go
        run: go test ./...

      - name: Build Windows desktop application
        run: wails3 build

  formal-client:
    name: Formal client frontend and Go build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: app/go.sum

      - name: Resolve Go dependencies
        shell: pwsh
        run: |
          go mod tidy
          Write-Output "GENERATED_GO_MOD_BEGIN"
          Get-Content go.mod
          Write-Output "GENERATED_GO_SUM_BEGIN"
          Get-Content go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3.exe
          key: wails3-${{ runner.os }}-go1.27-v3.0.0

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails3.exe'
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          }

      - name: Generate frontend bindings
        shell: pwsh
        run: wails3 generate bindings -ts

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Test Go
        run: go test ./...

      - name: Build Windows executable
        shell: pwsh
        run: go build -o bin/My-LiveHub.exe .

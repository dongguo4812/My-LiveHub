name: Desktop validation

on:
  push:
    branches:
      - dev
      - master
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-client:
    name: Formal client frontend and Go validation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hex lifecycle test dependencies
        shell: pwsh
        run: python -m pip install Flask requests Pillow

      - name: Validate Hex Python syntax and lifecycle
        shell: pwsh
        run: |
          python -m compileall -q internal/desktop/lolhex/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s internal/desktop/lolhex/runtime/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up MSYS2 UCRT64 toolchain for production QuickJS
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build pinned QuickJS-NG shared runtime for production tests
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs.git "$TEMP_DIR/quickjs-ng"
          cmake -S "$WORKSPACE/app/internal/music/lxruntime/poc/native" -B "$TEMP_DIR/lx-quickjs-production-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUICKJS_NG_SOURCE_DIR="$TEMP_DIR/quickjs-ng"
          cmake --build "$TEMP_DIR/lx-quickjs-production-build" --config Release
          DLL="$(find "$TEMP_DIR/lx-quickjs-production-build" -type f -iname 'lxqjs.dll' -print -quit)"
          test -n "$DLL"
          mkdir -p "$WORKSPACE/app/bin"
          cp "$DLL" "$WORKSPACE/app/bin/lxqjs.dll"
          GITHUB_ENV_PATH="$(cygpath -u "$GITHUB_ENV")"
          printf 'CGO_ENABLED=0\nMYLIVEHUB_QUICKJS_LIB=%s\\app\\bin\\lxqjs.dll\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV_PATH"

      - name: Verify Go modules
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3.exe
          key: wails3-${{ runner.os }}-go1.27-v3.1.0

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails3.exe'
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          }

      - name: Generate frontend bindings
        shell: pwsh
        run: wails3 generate bindings -ts

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Test all Go packages with the standard test runtime
        run: go test ./...

      - name: Test production LX runtime and capability import paths
        run: go test -tags lxproduction ./internal/music/lxruntime ./internal/desktop -run '^TestProductionLX'

      # Run PoC-only real-provider/browser checks here to reuse this workflow's runtime and dependencies.
      - name: Import and enable the real upstream fish/latest.js in isolated QuickJS
        shell: pwsh
        env:
          MYLIVEHUB_LX_FISH_INTEGRATION: '1'
          CGO_ENABLED: '0'
          MYLIVEHUB_QUICKJS_LIB: ${{ github.workspace }}\app\bin\lxqjs.dll
        run: go test -tags lxproduction -count=1 -v -run '^TestProductionLXFishLatestRealImportAndEnable$' ./internal/desktop

      - name: Resolve real 晴天 playback URL through fish/latest.js
        shell: pwsh
        env:
          MYLIVEHUB_LX_FISH_PLAYBACK_INTEGRATION: '1'
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\my-livehub-playback-url.txt
          CGO_ENABLED: '0'
          MYLIVEHUB_QUICKJS_LIB: ${{ github.workspace }}\app\bin\lxqjs.dll
        run: go test -tags lxproduction -count=1 -v -run '^TestProductionLXFishSunnyDayPlaybackURL$' ./internal/desktop

      - name: Resolve real 稻香 through the uploaded Xinghai LX source
        shell: pwsh
        env:
          MYLIVEHUB_LX_XINGHAI_PLAYBACK_INTEGRATION: '1'
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\\my-livehub-playback-url.txt
          CGO_ENABLED: '0'
          MYLIVEHUB_QUICKJS_LIB: ${{ github.workspace }}\\app\\bin\\lxqjs.dll
        run: go test -tags lxproduction -count=1 -v -run '^TestProductionLXXinghaiDaoxiangPlaybackURL        shell: pwsh
        working-directory: app/frontend
        run: node --experimental-strip-types ../../.github/scripts/music-synced-lyrics-smoke.mjs

      - name: Install Chromium and run real HTMLAudio playback and lyrics tests
        shell: pwsh
        working-directory: app/frontend
        env:
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\my-livehub-playback-url.txt
        run: |
          npm install --no-save --package-lock=false playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../.github/scripts/music-htmlaudio-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../.github/scripts/music-lyrics-overlay-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        shell: pwsh
        run: go build -tags lxproduction -ldflags "-H=windowsgui" -o bin/My-LiveHub.exe .
 ./internal/desktop

      - name: Verify synchronized lyrics parsing and active-line timing
        shell: pwsh
        working-directory: app/frontend
        run: node --experimental-strip-types ../../.github/scripts/music-synced-lyrics-smoke.mjs

      - name: Install Chromium and run real HTMLAudio playback and lyrics tests
        shell: pwsh
        working-directory: app/frontend
        env:
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\my-livehub-playback-url.txt
        run: |
          npm install --no-save --package-lock=false playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../.github/scripts/music-htmlaudio-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../.github/scripts/music-lyrics-overlay-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        shell: pwsh
        run: go build -tags lxproduction -ldflags "-H=windowsgui" -o bin/My-LiveHub.exe .

name: QuickJS runtime diagnostics

on:
  # Manual diagnostic run only. Automatic validation is owned by Desktop validation.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickjs-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickjs-windows-x64:
    if: github.ref == 'refs/heads/feat/lx-js-runtime-quickjs-poc'
    name: QuickJS-NG Windows x64 LX runtime diagnostics
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Avoid a full MSYS2 system upgrade on every CI run; it adds extra
          # mirror metadata requests and has caused transient signature-download timeouts.
          update: false
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Fetch pinned QuickJS-NG source
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs-ng"
          git -C "$RUNNER_TEMP/quickjs-ng" rev-parse HEAD

      - name: Instrument pinned QuickJS arithmetic opcodes for LX signature tracing
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          python "$WORKSPACE/.github/scripts/instrument-quickjs-ops.py" "$RUNNER_TEMP/quickjs-ng/quickjs.c"

      - name: Build QuickJS-NG shared runtime
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          cmake -S "$WORKSPACE/app/internal/music/lxruntime/poc/native" -B "$TEMP_DIR/lx-quickjs-host-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUICKJS_NG_SOURCE_DIR="$TEMP_DIR/quickjs-ng"
          cmake --build "$TEMP_DIR/lx-quickjs-host-build" --config Release
          dll="$(find "$TEMP_DIR/lx-quickjs-host-build" -type f -iname 'lxqjs.dll' -print -quit)"
          test -n "$dll"
          mkdir -p "$WORKSPACE/app/bin"
          cp "$dll" "$WORKSPACE/app/bin/lxqjs.dll"
          ls -lh "$WORKSPACE/app/bin/lxqjs.dll"
          GITHUB_ENV_PATH="$(cygpath -u "$GITHUB_ENV")"
          printf 'CGO_ENABLED=0\nMYLIVEHUB_QUICKJS_LIB=%s\\app\\bin\\lxqjs.dll\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV_PATH"

      - name: Test deterministic LX runtime and music packages without CGO
        shell: pwsh
        working-directory: app
        run: |
          $env:CGO_ENABLED = '0'
          go test -tags lxquickjs -count=1 -v ./internal/music/lxruntime ./internal/music
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags lxquickjs ./internal/music/lxruntime ./internal/music
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate production QuickJS tag for music packages without CGO
        shell: pwsh
        working-directory: app
        run: |
          $env:CGO_ENABLED = '0'
          go test -tags lxproduction ./internal/music/lxruntime ./internal/music
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify QuickJS lyric Action dispatch, normalization, cancellation and no Go fallback
        shell: pwsh
        working-directory: app
        run: |
          $env:CGO_ENABLED = '0'
          go test -tags lxproduction -count=1 -v -run '^(TestGetLyricsAcceptsStructuredLXResponse|TestGetLyricsDoesNotFallBackAfterLXActionFailure|TestGetLyricsForRequestCancelsLXScriptAndDoesNotStartNativeFallback|TestShutdownCancelsInFlightLyricsRequests|TestGetLyricsCachesSuccessfulLXScriptLyricsByTrackIdentity|TestProductionLXCommunityActionsReachMusicService)      - name: Test desktop music runtime integration without CGO
        shell: pwsh
        working-directory: app
        run: |
          $env:CGO_ENABLED = '0'
          go test -tags lxproduction -run 'TestMusicServiceGetSourcesReportsActualRuntimeAvailability|TestProductionLXScriptRuntimeAvailabilityRequiresImportedScripts|TestProductionLXScriptRuntimeImportRestoreEnableDelete|TestProductionLXScriptRuntimeKeepsExactlyOneScriptEnabled|TestProductionLXScriptRuntimeRestoresLegacyMultipleEnabledWithSingleWinner|TestProductionLXScriptRuntimeQuarantinesMalformedStore|TestProductionLXScriptRuntimeIsolatesInvalidPersistedScript|TestMusicServiceLXScriptManagementAPI|TestLXScriptStoreSerializationIsStable|TestProductionLXCommunityActionsReachMusicService|TestProductionLXCommunityAction|TestNormalizeLXScriptSearchResult|TestDispatchLXExtension|TestQueuePlaybackPassesStructuredResourceToResourceAwareEngine|TestMusicServiceMediaFailureRefreshIsIdempotent|TestMusicServiceMediaFailureRefreshRejectsMismatchedResource|TestHTMLAudioPlaybackEngineAppliesPersistedVolumeBeforeFirstTrack|TestHTMLAudioPlaybackEngineUsesStructuredResourceAndSession|TestHTMLAudioPlaybackEngineRejectsTrackResourceMismatch|TestHTMLAudioPlaybackEngineRefreshesFailedMediaAtMostOnce|TestHTMLAudioPlaybackEngineKeepsWatcherLoadingDuringRefresh|TestMusicServiceBeginPlaybackResolutionCancelsPreviousRequest|TestHTMLAudioPlaybackEngineRejectsResourcesRequiringMediaHeadersOrProxy|TestHTMLAudioQueueEndDoesNotFallBackToLegacyPlayer|TestHTMLAudioPlaybackEnginePreservesVolumeAcrossTrackLoads|TestHTMLAudioPlaybackEngineClampsAndAppliesVolumeToActiveSession|TestHTMLAudioPlaybackEngineVolumePersistsAcrossSourceSwitchAndMuteRestore|TestHTMLAudioPlaybackEngineVolumeIsRetainedWhenMediaURLRefreshes|TestHTMLAudioPlaybackEngineSeekAndStopCommands|TestMusicServiceStopPublishesStoppedSnapshot|TestMusicServiceCanPreviousTracksPlaybackHistory|TestMusicServiceNextAndPreviousNavigateHTMLAudioQueueHistory|TestGetLyricsHTMLAudioUsesNativeProviderAdapter|TestGetLyricsHTMLAudioRejectsUnknownProviderExplicitly' ./internal/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import and enable the real upstream fish/latest.js in isolated QuickJS
        shell: pwsh
        working-directory: app
        env:
          MYLIVEHUB_LX_FISH_INTEGRATION: '1'
          CGO_ENABLED: '0'
          MYLIVEHUB_QUICKJS_LIB: ${{ github.workspace }}\app\bin\lxqjs.dll
        run: |
          go test -tags lxproduction -count=1 -v -run '^TestProductionLXFishLatestRealImportAndEnable$' ./internal/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve real 晴天 playback URL through fish/latest.js
        shell: pwsh
        working-directory: app
        env:
          MYLIVEHUB_LX_FISH_PLAYBACK_INTEGRATION: '1'
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\my-livehub-playback-url.txt
          CGO_ENABLED: '0'
          MYLIVEHUB_QUICKJS_LIB: ${{ github.workspace }}\app\bin\lxqjs.dll
        run: |
          go test -tags lxproduction -count=1 -v -run "^TestProductionLXFishSunnyDayPlaybackURL$" ./internal/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails3.exe'
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          }

      - name: Generate frontend bindings
        shell: pwsh
        working-directory: app
        run: |
          wails3 generate bindings -ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Verify synchronized lyrics parsing and active-line timing
        shell: pwsh
        working-directory: app/frontend
        run: |
          node --experimental-strip-types ../../.github/scripts/music-synced-lyrics-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Chromium and run real HTMLAudio playback test
        shell: pwsh
        working-directory: app/frontend
        env:
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\my-livehub-playback-url.txt
        run: |
          npm install --no-save --package-lock=false playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../.github/scripts/music-htmlaudio-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../.github/scripts/music-lyrics-overlay-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Build Windows HTMLAudio executable
        shell: pwsh
        working-directory: app
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $env:CGO_ENABLED = '0'
          go build -tags lxproduction -ldflags "-H=windowsgui" -o bin/My-LiveHub.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows QuickJS diagnostics executable
        uses: actions/upload-artifact@v4
        with:
          name: My-LiveHub-QuickJS-Diagnostics
          path: |
            app/bin/My-LiveHub.exe
            app/bin/lxqjs.dll
          if-no-files-found: error
          retention-days: 7


      - name: Package pinned QuickJS-NG runtime for local development
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath app/bin/lxqjs.dll -DestinationPath app/bin/lxqjs-windows-amd64.zip -Force
          $hash = (Get-FileHash app/bin/lxqjs-windows-amd64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lxqjs-windows-amd64.zip" | Set-Content -Path app/bin/lxqjs-windows-amd64.zip.sha256 -NoNewline

      - name: Verify local no-CGO bootstrap from published runtime
        shell: pwsh
        working-directory: app
        run: |
          Remove-Item -LiteralPath bin/lxqjs.dll -Force
          $env:CGO_ENABLED = '0'
          $env:GOFLAGS = '-tags=lxproduction'
          ./scripts/lxproduction.ps1 -Mode build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
 ./internal/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Test desktop music runtime integration without CGO
        shell: pwsh
        working-directory: app
        run: |
          $env:CGO_ENABLED = '0'
          go test -tags lxproduction -run 'TestMusicServiceGetSourcesReportsActualRuntimeAvailability|TestProductionLXScriptRuntimeAvailabilityRequiresImportedScripts|TestProductionLXScriptRuntimeImportRestoreEnableDelete|TestProductionLXScriptRuntimeKeepsExactlyOneScriptEnabled|TestProductionLXScriptRuntimeRestoresLegacyMultipleEnabledWithSingleWinner|TestProductionLXScriptRuntimeQuarantinesMalformedStore|TestProductionLXScriptRuntimeIsolatesInvalidPersistedScript|TestMusicServiceLXScriptManagementAPI|TestLXScriptStoreSerializationIsStable|TestProductionLXCommunityActionsReachMusicService|TestProductionLXCommunityAction|TestNormalizeLXScriptSearchResult|TestDispatchLXExtension|TestQueuePlaybackPassesStructuredResourceToResourceAwareEngine|TestMusicServiceMediaFailureRefreshIsIdempotent|TestMusicServiceMediaFailureRefreshRejectsMismatchedResource|TestHTMLAudioPlaybackEngineAppliesPersistedVolumeBeforeFirstTrack|TestHTMLAudioPlaybackEngineUsesStructuredResourceAndSession|TestHTMLAudioPlaybackEngineRejectsTrackResourceMismatch|TestHTMLAudioPlaybackEngineRefreshesFailedMediaAtMostOnce|TestHTMLAudioPlaybackEngineKeepsWatcherLoadingDuringRefresh|TestMusicServiceBeginPlaybackResolutionCancelsPreviousRequest|TestHTMLAudioPlaybackEngineRejectsResourcesRequiringMediaHeadersOrProxy|TestHTMLAudioQueueEndDoesNotFallBackToLegacyPlayer|TestHTMLAudioPlaybackEnginePreservesVolumeAcrossTrackLoads|TestHTMLAudioPlaybackEngineClampsAndAppliesVolumeToActiveSession|TestHTMLAudioPlaybackEngineVolumePersistsAcrossSourceSwitchAndMuteRestore|TestHTMLAudioPlaybackEngineVolumeIsRetainedWhenMediaURLRefreshes|TestHTMLAudioPlaybackEngineSeekAndStopCommands|TestMusicServiceStopPublishesStoppedSnapshot|TestMusicServiceCanPreviousTracksPlaybackHistory|TestMusicServiceNextAndPreviousNavigateHTMLAudioQueueHistory|TestGetLyricsHTMLAudioUsesNativeProviderAdapter|TestGetLyricsHTMLAudioRejectsUnknownProviderExplicitly' ./internal/desktop

name: Real LX music playback validation

on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-live-playback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-fish-playback:
    name: Real fish musicUrl and Chromium HTMLAudio playback
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Fetch pinned QuickJS-NG source
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs-ng"
          git -C "$RUNNER_TEMP/quickjs-ng" rev-parse HEAD

      - name: Build the production QuickJS-NG runtime
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          python "$WORKSPACE/.github/scripts/instrument-quickjs-ops.py" "$TEMP_DIR/quickjs-ng/quickjs.c"
          cmake -S "$WORKSPACE/app/internal/music/lxruntime/poc/native" -B "$TEMP_DIR/lx-quickjs-host-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUICKJS_NG_SOURCE_DIR="$TEMP_DIR/quickjs-ng"
          cmake --build "$TEMP_DIR/lx-quickjs-host-build" --config Release
          dll="$(find "$TEMP_DIR/lx-quickjs-host-build" -type f -iname 'lxqjs.dll' -print -quit)"
          test -n "$dll"
          mkdir -p "$WORKSPACE/app/bin"
          cp "$dll" "$WORKSPACE/app/bin/lxqjs.dll"
          ls -lh "$WORKSPACE/app/bin/lxqjs.dll"

      - name: Resolve 晴天 through real fish/latest.js and verify media bytes
        shell: pwsh
        working-directory: app
        env:
          MYLIVEHUB_LX_FISH_PLAYBACK_INTEGRATION: '1'
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\my-livehub-playback-url.txt
          CGO_ENABLED: '0'
          MYLIVEHUB_QUICKJS_LIB: ${{ github.workspace }}\app\bin\lxqjs.dll
        run: |
          go test -tags lxproduction -count=1 -v -run "^TestProductionLXFishSunnyDayPlaybackURL$" ./internal/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies and Playwright
        shell: pwsh
        working-directory: app/frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --no-save --package-lock=false playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Play the real fish media URL in Chromium HTMLAudio
        shell: pwsh
        working-directory: app/frontend
        env:
          MYLIVEHUB_PLAYBACK_URL_FILE: ${{ runner.temp }}\my-livehub-playback-url.txt
        run: |
          node ../../.github/scripts/music-htmlaudio-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

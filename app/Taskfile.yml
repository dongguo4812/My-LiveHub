version: '3'

vars:
  VITE_PORT: '{{.WAILS_VITE_PORT | default "8769"}}'

tasks:
  dev:
    summary: 生成 Wails 前端绑定并启动 My-LiveHub 桌面开发环境
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev-preflight.ps1 -Port {{.VITE_PORT}}
      - wails3 generate bindings -ts
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
  build:
    summary: 构建 My-LiveHub 桌面应用
    cmds:
      - wails3 build
  frontend:install:
    summary: 安装管理端前端依赖
    cmds:
      - npm --prefix frontend install
  frontend:build:
    summary: 构建管理端前端
    cmds:
      - npm --prefix frontend run build
  test:
    summary: 运行 Go 测试
    cmds:
      - go test ./...

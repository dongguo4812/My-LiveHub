
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOL 战绩条</title>

<style>
/* Chromium / OBS 浏览器源：沿用歌曲、视频展示页已验证的透明背景处理。 */
html {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 0;
    background: transparent !important;
    background-color: transparent !important;
    color: #fff;
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
}

/* 整体容器：禁止出现滚动条 */
#bar {
    width: 100%;
    height: 100%;
    display: block;
    padding: 6px;
    overflow: hidden;
}

/* 整条战绩条：透明背景 */
.bar-inner {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 0;
    width: max-content;
    max-width: none;
    padding: 8px 10px;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

/* 左侧固定信息区：只显示在第一行 */
.left-info {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    align-self: flex-start;
}

/* 第一栏：账号名、组队人数 */
.account {
    flex: 0 0 auto;
    min-width: 190px;
    max-width: 260px;
    min-height: 78px;
    padding: 8px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    border-right: 1px solid rgba(190, 205, 225, 0.38);
}

.account-name {
    max-width: 100%;
    font-size: 19px;
    line-height: 1.4;
    font-weight: 700;
    color: #4ade80;
    overflow-wrap: anywhere;
}

/* 组队人数 */
.lobby-count {
    margin-top: 5px;
    font-size: 16px;
    line-height: 1.4;
    font-weight: 700;
    color: #FFD700;
    overflow-wrap: anywhere;
}

/* 第二栏：区服名称与胜负统计 */
.record {
    flex: 0 0 auto;
    min-height: 78px;
    padding: 7px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    border-right: 1px solid rgba(190, 205, 225, 0.38);
}

.region {
    font-size: 15px;
    line-height: 1.3;
    font-weight: 700;
    color: #4ade80;
    overflow-wrap: anywhere;
}

.record-values {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.record-value {
    font-size: 23px;
    line-height: 1.2;
    font-weight: 700;
    white-space: nowrap;
}

.wins {
    color: #16d982;
}

.losses {
    color: #ff4d57;
}

/* 右侧战绩区：固定每行20局 */
.games {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(20, 71px);
    grid-auto-rows: 90px;
    gap: 1px;
    padding-left: 12px;
    align-content: start;
    align-items: start;
}

/* 每张卡片：71px宽、90px高 */
.game {
    width: 71px;
    height: 90px;
    min-width: 71px;
    min-height: 90px;
    padding: 4px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: transparent;
    border: 3px solid rgba(180, 190, 210, 0.45);
    border-radius: 12px;
    overflow: hidden;
}

/* 胜利边框 */
.game.win {
    border-color: #00df78;
}

/* 失败边框 */
.game.loss {
    border-color: #ff3948;
}

/* 英雄头像 */
.champ {
    display: block;
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
}

/* KDA */
.kda {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 12px;
    line-height: 1.3;
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* 击杀：绿色 */
.kda-kills {
    color: #4ade80;
}

/* 死亡：红色 */
.kda-deaths {
    color: #ff5c65;
}

/* 助攻：蓝色 */
.kda-assists {
    color: #60a5fa;
}

/* KDA 分隔符 */
.kda-separator {
    color: rgba(255, 255, 255, 0.8);
}
</style>
</head>

<body>
<div id="bar"></div>
<script>
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
}[c]));

let previousGameIds = null;
let previousGameCount = null;
let previousLobbyMemberCount = undefined;
let previousAccount = null;
let previousRegion = null;
let previousConfig = null;

function getGameIds(games) {
    return games.map(game => String(game.gameId ?? ''));
}

function sameArray(a, b) {
    return Array.isArray(a)
        && Array.isArray(b)
        && a.length === b.length
        && a.every((value, index) => value === b[index]);
}

function sameConfig(a, b) {
    return !!a && !!b
        && a.max_games === b.max_games
        && a.mode_filter === b.mode_filter
        && a.batch_gap_min === b.batch_gap_min;
}

function renderBar(data, games) {
    const root = document.getElementById('bar');
    const lobbyTitles = {
        1: '独闯天涯',
        2: '双剑合璧',
        3: '桃园三杰',
        4: '四大天王',
        5: '五子登科'
    };
    const lobbyTitle = lobbyTitles[Number(data.lobby_member_count)] || '';

    let html = `
        <div class="bar-inner">
            <div class="left-info">
                <div class="account">
                    <div class="account-name">
                        ${escapeHtml(data.account)}
                    </div>
                    ${lobbyTitle ? `
                    <div class="lobby-count">
                        ${lobbyTitle}
                    </div>
                    ` : ''}
                </div>

                <div class="record">
                    <div class="region">
                        ${escapeHtml(data.region)}
                    </div>
                    <div class="record-values">
                        <div class="record-value wins">
                            胜${escapeHtml(data.wins)}
                        </div>
                        <div class="record-value losses">
                            负${escapeHtml(data.losses)}
                        </div>
                    </div>
                </div>
            </div>

            <div class="games">
    `;

    for (const game of games) {
        const championId = Number(game.champion_id || 0);
        const resultClass = game.win ? 'win' : 'loss';

        const iconUrl = championId
            ? 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/' + championId + '.png'
            : '';

        const k = escapeHtml(game.k);
        const d = escapeHtml(game.d);
        const a = escapeHtml(game.a);

        html += `
            <div class="game ${resultClass}">
                ${
                    iconUrl
                        ? `<img
                            class="champ"
                            src="${iconUrl}"
                            alt=""
                            onerror="this.style.display='none'"
                        >`
                        : ''
                }

                <div class="kda">
                    <span class="kda-kills">${k}</span>
                    <span class="kda-separator">/</span>
                    <span class="kda-deaths">${d}</span>
                    <span class="kda-separator">/</span>
                    <span class="kda-assists">${a}</span>
                </div>
            </div>
        `;
    }

    html += `
            </div>
        </div>
    `;

    root.innerHTML = html;
}

async function loadBar() {
    try {
        const response = await fetch('/api/snapshot', {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();
        const games = Array.isArray(data.games) ? data.games : [];
        const gameIds = getGameIds(games);
        const gameCount = games.length;
        const config = data.config || {};

        // 首次载入：建立基准并显示当前战绩。
        if (previousGameIds === null) {
            renderBar(data, games);
            previousGameIds = gameIds;
            previousGameCount = gameCount;
            previousLobbyMemberCount = data.lobby_member_count ?? null;
            previousAccount = data.account ?? '';
            previousRegion = data.region ?? '';
            previousConfig = { ...config };
            return;
        }

        // 新增对局：发现此前不存在的 gameId。
        const hasNewGame = gameIds.some(
            id => id && !previousGameIds.includes(id)
        );

        // 配置变化：例如 max_games 修改导致显示对局数变化。
        const configChanged = !sameConfig(previousConfig, config);

        // 对局数量变化：例如配置改变后显示局数增减。
        const countChanged = gameCount !== previousGameCount;
        const lobbyCountChanged = (data.lobby_member_count ?? null) !== previousLobbyMemberCount;
        const accountChanged = (data.account ?? '') !== previousAccount;
        const regionChanged = (data.region ?? '') !== previousRegion;

        // 对局列表发生变化：兼容旧对局被替换或移除。
        const gameListChanged = !sameArray(previousGameIds, gameIds);

        // 仅在显示内容发生变化时重新渲染。
        if (hasNewGame || countChanged || gameListChanged || configChanged || lobbyCountChanged || accountChanged || regionChanged) {
            renderBar(data, games);
        }

        previousGameIds = gameIds;
        previousGameCount = gameCount;
        previousLobbyMemberCount = data.lobby_member_count ?? null;
        previousAccount = data.account ?? '';
        previousRegion = data.region ?? '';
        previousConfig = { ...config };

    } catch (error) {
        // 请求失败时保留现有显示，下次轮询继续尝试。
        console.warn('[LOL 战绩条] 读取失败', error);
    }
}

// 首次快照完成后建立服务器推送连接，避免初次加载请求相互覆盖。
loadBar().finally(() => {
    if (typeof EventSource === 'undefined') {
        return;
    }

    const lobbyEvents = new EventSource('/api/lobby-events');
    lobbyEvents.addEventListener('lobby-change', () => {
        loadBar();
    });
    lobbyEvents.addEventListener('shutdown', () => {
        lobbyEvents.close();
        clearInterval(barRefreshTimer);
    });
});

// 定时刷新作为兜底；组队人数变化仍由 SSE 即时触发。
const barRefreshTimer = setInterval(loadBar, 10000);
</script>
</body>
</html>

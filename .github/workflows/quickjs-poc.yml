name: QuickJS-NG PoC

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickjs-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickjs-windows-x64:
    name: QuickJS-NG Windows x64 CGo and LX runtime
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Avoid a full MSYS2 system upgrade on every CI run; it adds extra
          # mirror metadata requests and has caused transient signature-download timeouts.
          update: false
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Fetch pinned QuickJS-NG source
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs-ng"
          git -C "$RUNNER_TEMP/quickjs-ng" rev-parse HEAD

      - name: Instrument pinned QuickJS arithmetic opcodes for LX signature tracing
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          python "$WORKSPACE/.github/scripts/instrument-quickjs-ops.py" "$RUNNER_TEMP/quickjs-ng/quickjs.c"

      - name: Build QuickJS-NG and native C API smoke test
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          cmake -S "$WORKSPACE/app/internal/music/lxruntime/poc/native" -B "$TEMP_DIR/lx-quickjs-host-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUICKJS_NG_SOURCE_DIR="$TEMP_DIR/quickjs-ng"
          cmake --build "$TEMP_DIR/lx-quickjs-host-build" --config Release
          mkdir -p "$WORKSPACE/app/internal/music/lxruntime/poc/native/lib"
          cp "$TEMP_DIR/lx-quickjs-host-build/lib/libqjs.a" "$WORKSPACE/app/internal/music/lxruntime/poc/native/lib/libqjs.a"
          GITHUB_ENV_PATH="$(cygpath -u "$GITHUB_ENV")"
          printf 'CGO_ENABLED=1\nCC=gcc\n' >> "$GITHUB_ENV_PATH"
          host="$(find "$TEMP_DIR/lx-quickjs-host-build" -type f -iname 'lx_quickjs_host_smoke.exe' -print -quit)"
          test -n "$host"
          test -f "$TEMP_DIR/lx-quickjs-host-build/lib/libqjs.a"
          "$host"
          ls -lh "$host" "$TEMP_DIR/lx-quickjs-host-build/lib/libqjs.a"

      - name: Test deterministic LX runtime and music packages
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          cd "$WORKSPACE/app"
          export CGO_ENABLED=1
          export CC=gcc
          go test -tags lxquickjs -count=1 -v ./internal/music/lxruntime ./internal/music
          go vet -tags lxquickjs ./internal/music/lxruntime ./internal/music

      - name: Validate production QuickJS tag for music packages
        shell: pwsh
        working-directory: app
        run: |
          go test -tags lxproduction ./internal/music/lxruntime ./internal/music
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test desktop music runtime integration only
        shell: msys2 {0}
        working-directory: app
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go test -tags lxproduction -run 'TestMusicServiceGetSourcesReportsActualRuntimeAvailability|TestProductionLXScriptRuntimeAvailabilityRequiresImportedScripts|TestProductionLXScriptRuntimeImportRestoreEnableDelete|TestProductionLXScriptRuntimeQuarantinesMalformedStore|TestProductionLXScriptRuntimeIsolatesInvalidPersistedScript|TestMusicServiceLXScriptManagementAPI|TestLXScriptStoreSerializationIsStable|TestProductionLXCommunityActionsReachMusicService|TestProductionLXCommunityAction|TestNormalizeLXScriptSearchResult|TestDispatchLXExtension|TestQueuePlaybackPassesStructuredResourceToResourceAwareEngine|TestMusicServiceMediaFailureRefreshIsIdempotent|TestMusicServiceMediaFailureRefreshRejectsMismatchedResource|TestHTMLAudioPlaybackEngineUsesStructuredResourceAndSession|TestHTMLAudioPlaybackEngineRejectsTrackResourceMismatch|TestHTMLAudioPlaybackEngineRefreshesFailedMediaAtMostOnce|TestHTMLAudioPlaybackEngineKeepsWatcherLoadingDuringRefresh|TestMusicServiceBeginPlaybackResolutionCancelsPreviousRequest|TestHTMLAudioPlaybackEngineRejectsResourcesRequiringMediaHeadersOrProxy|TestHTMLAudioQueueEndDoesNotFallBackToLegacyPlayer' ./internal/desktop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails3.exe'
          if (!(Test-Path $wails)) {
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          }

      - name: Generate frontend bindings
        shell: pwsh
        working-directory: app
        run: |
          wails3 generate bindings -ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Build Windows HTMLAudio D PoC executable
        shell: pwsh
        working-directory: app
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -tags lxproduction -ldflags "-H=windowsgui" -o bin/My-LiveHub.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows HTMLAudio D PoC executable
        uses: actions/upload-artifact@v4
        with:
          name: My-LiveHub-HTMLAudio-D-PoC
          path: app/bin/My-LiveHub.exe
          if-no-files-found: error
          retention-days: 7


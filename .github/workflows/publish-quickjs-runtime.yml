name: Publish pinned QuickJS runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-runtime:
    name: Build and publish QuickJS-NG runtime
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip

      - name: Build pinned QuickJS-NG DLL
        shell: msys2 {0}
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs.git "$TEMP_DIR/quickjs-ng"
          cmake -S "$WORKSPACE/app/internal/music/lxruntime/native" -B "$TEMP_DIR/lx-quickjs-runtime-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUICKJS_NG_SOURCE_DIR="$TEMP_DIR/quickjs-ng"
          cmake --build "$TEMP_DIR/lx-quickjs-runtime-build" --config Release
          DLL="$(find "$TEMP_DIR/lx-quickjs-runtime-build" -type f -iname 'lxqjs.dll' -print -quit)"
          test -n "$DLL"
          objdump -p "$DLL" | grep -q 'lxqjs_eval_timed'
          mkdir -p "$WORKSPACE/runtime-assets"
          cp "$DLL" "$WORKSPACE/runtime-assets/lxqjs.dll"
          cd "$WORKSPACE/runtime-assets"
          zip -9 lxqjs-windows-amd64.zip lxqjs.dll
          sha256sum lxqjs-windows-amd64.zip | awk '{print $1 "  " $2}' > lxqjs-windows-amd64.zip.sha256

      - name: Publish immutable runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quickjs-ng-v0.18.0-lxabi2
          name: QuickJS-NG v0.18.0 LX ABI 2
          body: Built from the repository's pinned QuickJS-NG v0.18.0 source and explicit LXQJS DLL exports.
          files: |
            runtime-assets/lxqjs-windows-amd64.zip
            runtime-assets/lxqjs-windows-amd64.zip.sha256
